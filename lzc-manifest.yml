application:
  subdomain: yarr
  multi_instance: false
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://yarr:7070/

services:
  yarr:
    # upstream: nkanaev/yarr:v2.9
    image: docker.1ms.run/nkanaev/yarr:v2.9
    environment:
      - |-
        YARR_USER={{ .U.reader_user | replace "\r" "" | replace "\n" "" }}
      - |-
        YARR_PASS={{ .U.reader_secret | replace "\r" "" | replace "\n" "" }}
    command: sh /lzcapp/pkg/content/start.sh
    binds:
      - /lzcapp/var/data:/data

usage: |
  Yarr 是极简 RSS/Atom 订阅阅读器：没有多余的推荐和算法，只按你订阅的源列文章。

  使用方法：
  1. 打开应用，浏览器会弹出原生登录框，输入部署参数里的用户名和密码。
  2. 点「Add feed」粘贴 RSS/Atom 地址订阅；也支持导入 OPML 文件。
  3. 左侧按订阅源分组浏览，未读会标出来。

  数据与安全：
  - 订阅源、已读状态和缓存都保存在 /lzcapp/var/data 下的 SQLite 数据库里，卸载应用会一并删除，重要订阅建议导出 OPML 备份。
  - 本包强制启用登录：Yarr 默认对任何能访问端口的人开放，这里改为启动时根据部署参数生成认证文件，缺失或非法就直接拒绝启动。
  - 认证文件写在内存临时目录，不随包发布、不落到数据卷。
  - 应用同时保留了懒猫入口鉴权。

  说明：
  - 用户名和密码都不能包含冒号（Yarr 按第一个冒号切分账号密码）；密码至少 12 位。
  - 改部署参数后重新部署生效。
  - 未做真机验证：登录、订阅、OPML 导入导出、已读同步以及重启后持久化均未在设备上实测。
