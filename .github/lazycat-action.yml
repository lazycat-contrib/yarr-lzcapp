version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: yarr
build:
  toolchains: []
  run_buildscript: false
images:
  - id: yarr
    target: service
    service: yarr
    source: nkanaev/yarr
    channel: custom
    sort: semver
    tag_regex: '^v2[.][0-9]+$'
    version_regex: '^v(?P<version>[0-9]+)[.](?P<minor>[0-9]+)$'
    version_template: '{version}.{minor}.0'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Yarr
    skip_if_version_exists: true
